<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AlgoWiki - Building Knowledge Repositories</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="AlgoWiki is a Repository which contains resources on different topics of computer science.">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//unpkg.com/docsify/lib/themes/buble.css">
</head>
<body>
  <div id="app"></div>
</body>
<script src="//unpkg.com/docsify-edit-on-github@1.0.1/index.js"></script>
<script>
  window.$docsify = {
    coverpage: true,
    name: 'AlgoWiki',
    repo: 'https://github.com/vicky002/AlgoWiki',
    subMaxLevel: 4,
    loadSidebar: false,
    themeColor: '#3F51B5',
    ga: 'UA-45497633-7',
    codesponsor: 'p9HijS4T3i4dif3TiynvGHf1',
    search: 'auto',
    plugins: [
      EditOnGithubPlugin.create(
        'https://github.com/vicky002/AlgoWiki/blob/gh-pages/'
      ),
      function (hook) {
        var footer = [
          '<hr/>',
          '<footer>',
          '<span><a href="https://github.com/vicky002">Vikesh Tiwari</a> &copy;2017.</span>',
          '<span>Maintained by <a href="http://eulercoder.me" target="_blank">Eulercoder</a>.</span>',
          '</footer>'
        ].join('')
        hook.afterEach(function (html) {
          return html + footer
        })
      }
    ]
  }
</script>
<script src="//unpkg.com/docsify/lib/docsify.min.js"></script>
<script src="//unpkg.com/docsify/lib/plugins/external-script.min.js"></script>
<script src="//unpkg.com/docsify/lib/plugins/search.min.js"></script>
<script src="//unpkg.com/docsify/lib/plugins/ga.min.js"></script>
</html>
